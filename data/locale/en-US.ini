# Cast Beacon OBS plugin - en-US locale
# This plugin has NO visible UI. It runs silently: when you Start Streaming in
# OBS it adds a shadow RTMP output to the Cast Beacon relay, giving the overflow
# feed its own low-latency encoder. There is nothing to click in any OBS menu.
Language="English"
Name="Cast Beacon OBS Plugin"
Description="Sends OBS's program feed to the Cast Beacon local relay for overflow TVs."
