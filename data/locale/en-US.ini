# CastPilot OBS plugin - en-US locale
# This plugin has NO visible UI. It runs silently: when you Start Streaming in
# OBS it adds a shadow RTMP output to the CastPilot relay, sharing OBS's existing
# encoder (no second encode). There is nothing to click in any OBS menu.
Language="English"
CastPilot="CastPilot"
Description="Sends OBS's program feed to the CastPilot local relay for overflow TVs."